<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Oaks of Woodlake — Route Finder</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f3ef; margin: 0; padding: 16px; color: #2c2c2a;
  }
  .card {
    max-width: 760px; margin: 0 auto; background: #fff; border-radius: 14px;
    padding: 20px 18px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 19px; margin: 0 0 2px; text-align: center; }
  .sub { text-align: center; color: #6b6a65; font-size: 12px; margin-bottom: 4px; }
  .address { text-align: center; font-size: 11px; color: #8a8983; margin-bottom: 16px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  
  input[type=text] {
    flex: 1; font-size: 16px; padding: 12px;
    border: 1.5px solid #d8d6cc; border-radius: 8px; text-align: center;
  }
  input[type=text]:focus { outline: none; border-color: #0f6e56; }
  button {
    font-size: 15px; font-weight: 600; padding: 11px 18px;
    background: #0f6e56; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  button:active { background: #085041; }
  .hint { font-size: 11px; color: #8a8983; text-align: center; margin-bottom: 14px; }
  #result { margin-top: 8px; min-height: 20px; }
  .result-box {
    border: 2px solid #0f6e56; background: #e1f5ee; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 10px; font-size: 14px;
  }
  .result-box.notfound { border-color: #d85a30; background: #faece7; }
  
  .map-wrap { position:relative; width:100%; border-radius:8px; overflow:hidden; }
  .map-wrap img { display:block; width:100%; height:auto; }
  svg { position:absolute; top:0; left:0; width:100%; height:100%; }
  
  /* Pins are hidden by default, and pop into view when active */
  .bldg-pin { display: none; }
  .bldg-pin.active { display: block; }
  .pin-dot { fill:#e02020; stroke:#fff; stroke-width:2; }
  
  @keyframes pinPop { 
    0% { transform:scale(0); } 
    50% { transform:scale(1.4); } 
    100% { transform:scale(1); } 
  }
  .bldg-pin.active .pin-dot { animation: pinPop .4s ease-out; transform-origin: center; }
  
  /* Routes layout fix: forces paths into an active animated state when searched */
  .route { 
    fill: none; 
    stroke: #1d6fd8; 
    stroke-width: 5; 
    stroke-linecap: round; 
    stroke-linejoin: round; 
    display: none;
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.9)); 
  }
  
  .route.show { 
    display: block !important;
    stroke: #0076ff !important;
    stroke-dasharray: 8;
    animation: pathLaserFlow 1.5s linear infinite;
  }
  
  @keyframes pathLaserFlow {
    from { stroke-dashoffset: 20; }
    to { stroke-dashoffset: 0; }
  }
  
  footer { text-align:center; font-size:10.5px; color:#a8a69c; margin-top:12px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>The Oaks of Woodlake</h1>
  <div class="sub">Delivery route finder</div>
  <div class="address">2100 Tanglewilde St, Houston, TX 77063</div>

  <form id="searchForm">
    <input type="text" id="unitInput" placeholder="Enter unit #" inputmode="numeric" pattern="[0-9]*" autofocus>
    <button type="submit">Find route</button>
  </form>
  <div class="hint">Highlights the building on the map. e.g. 227, 512, 71</div>

  <div id="result"></div>

    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <!-- Route path definitions linked strictly to specific unit coordinate configurations -->
      <path id="route-227" class="route" d="M 15 90 L 35 65 L 50 50 L 70 45" />
      <path id="route-512" class="route" d="M 15 90 L 35 65 L 45 35 L 45 15" />
      <path id="route-71" class="route" d="M 15 90 L 25 85 L 20 70" />
      
      <!-- Corresponding Building Pins -->
      <g id="pin-227" class="bldg-pin"><circle cx="70" cy="45" r="2.5" class="pin-dot"/></g>
      <g id="pin-512" class="bldg-pin"><circle cx="45" cy="15" r="2.5" class="pin-dot"/></g>
      <g id="pin-71" class="bldg-pin"><circle cx="20" cy="70" r="2.5" class="pin-dot"/></g>
    </svg>
  </div>

  <footer>&copy; 2026 The Oaks of Woodlake</footer>
</div>

<script>
  const searchForm = document.getElementById('searchForm');
  const unitInput = document.getElementById('unitInput');

  searchForm.addEventListener('submit', function(e) {
    e.preventDefault();
    findRoute(unitInput.value.trim());
  });

  function findRoute(unit) {
    const resultDiv = document.getElementById('result');
    
    // Clear previous dashboard visibility highlights
    document.querySelectorAll('.route').forEach(r => r.classList.remove('show'));
    document.querySelectorAll('.bldg-pin').forEach(p => p.classList.remove('active'));
    
    const targetRoute = document.getElementById('route-' + unit);
    const targetPin = document.getElementById('pin-' + unit);
    
    if (targetRoute && targetPin) {
      targetRoute.classList.add('show');
      targetPin.classList.add('active');
      resultDiv.innerHTML = `<div class="result-box">Showing path for Unit <strong>${unit}</strong>. Follow the glowing blue laser line.</div>`;
    } else {
      resultDiv.innerHTML = `<div class="result-box notfound">Unit <strong>${unit}</strong> coordinates not yet mapped. Try searching 227, 512, or 71 to verify calculations.</div>`;
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const prefilledUnit = urlParams.get('unit');
    if (prefilledUnit && unitInput) {
      unitInput.value = prefilledUnit;
      findRoute(prefilledUnit);
    }
  });
</script>
</body>
</html>
