<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Oaks of Woodlake — Route Finder</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f3ef; margin: 0; padding: 16px; color: #2c2c2a;
  }
  .card {
    max-width: 760px; margin: 0 auto; background: #fff; border-radius: 14px;
    padding: 20px 18px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 19px; margin: 0 0 2px; text-align: center; }
  .sub { text-align: center; color: #6b6a65; font-size: 12px; margin-bottom: 4px; }
  .address { text-align: center; font-size: 11px; color: #8a8983; margin-bottom: 16px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] {
    flex: 1; font-size: 16px; padding: 12px 14px;
    border: 1.5px solid #d8d6cc; border-radius: 8px; text-align: center;
  }
  input[type=text]:focus { outline: none; border-color: #0f6e56; }
  button {
    font-size: 15px; font-weight: 600; padding: 11px 18px;
    background: #0f6e56; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  button:active { background: #085041; }
  .hint { font-size: 11px; color: #8a8983; text-align: center; margin-bottom: 14px; }
  #result { margin-top: 8px; min-height: 20px; }
  .result-box {
    border: 2px solid #0f6e56; background: #e1f5ee; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 10px; font-size: 14px;
  }
  .result-box.notfound { border-color: #d85a30; background: #faece7; }
  .big { font-size: 26px; font-weight: 700; text-align: center; color: #085041; margin-bottom: 2px; }
  .rline { display:flex; justify-content:space-between; padding:3px 0; font-size:13px; }
  .rlabel { color:#5f5e5a; }
  .rval { font-weight:600; }
  .map-wrap { position:relative; width:100%; border-radius:8px; overflow:hidden; }
  .map-wrap img { display:block; width:100%; height:auto; }
  svg { position:absolute; top:0; left:0; width:100%; height:100%; }
  .bldg-pin { opacity:0; transition:opacity .15s; }
  .bldg-pin.active { opacity:1; }
  .pin-dot { fill:#e02020; stroke:#fff; stroke-width:2; }
  @keyframes pinPop { 0% { transform:scale(0); } 70% { transform:scale(1.3); } 100% { transform:scale(1); } }
  .bldg-pin.active .pin-dot { animation: pinPop .35s ease-out; transform-origin:center; }
  @keyframes bubblePop { 0% { transform:scale(0.4) translateY(6px); opacity:0; } 60% { transform:scale(1.05) translateY(0); opacity:1; } 100% { transform:scale(1) translateY(0); opacity:1; } }
  .popup-bubble { animation: bubblePop .3s cubic-bezier(.34,1.56,.64,1) .1s both; transform-box: fill-box; transform-origin: center bottom; }
  
  .gate-dot { fill:#d85a30; stroke:#fff; stroke-width:1.5; }
  
  /* Upgraded Laser Animated Driving Paths styling */
  .route { 
    fill:none; 
    stroke:#1d6fd8; 
    stroke-width:5; 
    stroke-linecap:round; 
    stroke-linejoin:round; 
    opacity:0; 
    transition:opacity .3s;
    filter: drop-shadow(0 0 3px rgba(255,255,255,0.9)); 
  }
  .route.show { 
    opacity:1; 
    stroke-dasharray: 10, 10;
    animation: routeTravel 1.5s linear infinite;
  }
  @keyframes routeTravel {
    from { stroke-dashoffset: 20; }
    to { stroke-dashoffset: 0; }
  }

  footer { text-align:center; font-size:10.5px; color:#a8a69c; margin-top:12px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>The Oaks of Woodlake</h1>
  <div class="sub">Delivery route finder</div>
  <div class="address">2100 Tanglewilde St, Houston, TX 77063</div>

  <form id="searchForm">
    <!-- Clean Numeric Touch Input Fields Configured for Mobile Views -->
    <input type="text" id="unitInput" placeholder="Enter unit #" inputmode="numeric" pattern="[0-9]*" autofocus>
    <button type="submit">Find route</button>
  </form>
  <div class="hint">Highlights the building on the map. e.g. 227, 512, 71</div>

  <div id="result"></div>

  <div class="map-wrap">
